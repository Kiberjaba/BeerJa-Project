<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый пароль</title>
  <style>
    :root {
      --ink: #101116;
      --night: #191b22;
      --cloud: #f4f2ec;
      --fog: #9699a3;
      --pulse: #705cff;
      --signal: #c9ff47;
      --coral: #ff6b61;
      --surface: rgba(25, 27, 34, 0.86);
      --line: rgba(244, 242, 236, 0.14);
      --phone-max: 430px;
      --radius-md: 16px;
      --radius-pill: 999px;
      --font-ui: "Onest", "Avenir Next", "SF Pro Text", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      background: var(--ink);
      color: var(--cloud);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    .phone-shell {
      width: 100%;
      max-width: var(--phone-max);
      min-height: 100vh;
      background: var(--night);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      position: relative;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    @media (min-height: 700px) {
      .phone-shell {
        min-height: 844px;
        height: auto;
        border-radius: 40px;
        border: 1px solid var(--line);
        margin: 20px 0;
      }
    }

    .toast-container {
      position: absolute;
      top: 20px; left: 20px; right: 20px;
      z-index: 9999;
      display: flex; flex-direction: column; gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      padding: 14px 16px; border-radius: 14px;
      font-size: 14px; font-weight: 500; line-height: 1.3;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      opacity: 0; transform: translateY(-20px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast.error { background: rgba(255, 107, 97, 0.95); color: #ffffff; border: 1px solid var(--coral); }
    .toast.success { background: rgba(201, 255, 71, 0.95); color: var(--ink); border: 1px solid var(--signal); }
    .toast-icon { font-size: 18px; flex-shrink: 0; }

    .hero-content { margin-top: 30px; display: flex; flex-direction: column; gap: 8px; }
    .title { font-size: 26px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
    .description { color: var(--fog); font-size: 13px; line-height: 1.4; }

    .form-container { margin-top: 16px; }
    .register-form { display: flex; flex-direction: column; gap: 14px; }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-label { font-size: 12px; color: var(--fog); margin-left: 4px; }

    .input-wrapper { position: relative; display: flex; align-items: center; }

    .input-field {
      width: 100%; height: 46px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-md); padding: 0 16px;
      color: var(--cloud); font-size: 14px; font-family: inherit; outline: none;
      transition: border-color 0.2s ease;
    }
    .input-field:focus { border-color: var(--pulse); }
    .input-field::placeholder { color: rgba(150, 153, 163, 0.5); }

    .toggle-password {
      position: absolute; right: 14px; background: none; border: none;
      color: var(--fog); cursor: pointer; font-size: 16px;
    }

    .password-hints { font-size: 11px; color: var(--fog); margin-top: 4px; margin-left: 4px; line-height: 1.3; }
    .password-hints span { display: block; color: var(--coral); }
    .password-hints span.valid { color: var(--signal); }
    .spec-chars-note { font-size: 11px; color: var(--fog); opacity: 0.7; margin-top: 2px; margin-left: 4px; }

    .btn {
      min-height: 50px; width: 100%; border: none;
      border-radius: var(--radius-pill); font-size: 15px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.1s ease, opacity 0.2s ease; text-decoration: none; font-family: inherit;
    }
    .btn:active { transform: scale(0.98); }
    .primary-btn { background: var(--signal); color: var(--ink); margin-top: 8px; }
    .primary-btn:hover { background: #b5e838; }
    .demo-note { text-align: center; font-size: 12px; color: var(--fog); margin-top: 16px; line-height: 1.4; }
  </style>
</head>
<body>

  <main class="phone-shell">
    <div id="toastContainer" class="toast-container"></div>

    <div>
      <section class="hero-content">
        <h1 class="title">Новый пароль</h1>
        <p class="description">Придумайте и подтвердите новый надежный пароль для вашего аккаунта.</p>
      </section>

      <div class="form-container">
        <form id="resetForm" class="register-form" onsubmit="handleResetPassword(event)">
          <div class="input-group">
            <label class="input-label" for="password">Новый пароль</label>
            <div class="input-wrapper">
              <input class="input-field" type="password" id="password" placeholder="От 10 до 128 символов" required oninput="validatePasswordInput(this.value)">
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</button>
            </div>
            <div class="spec-chars-note">Разрешенные спецсимволы: ! @ # $ % ^ & * ( ) _ + - = [ ] { } | ; : , . < > ?</div>
            <div class="password-hints" id="passwordHints">
              <span id="hintLength">✕ От 10 до 128 символов</span>
              <span id="hintChars">✕ Латинская буква, цифра и спецсимвол</span>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label" for="confirmPassword">Повторите новый пароль</label>
            <div class="input-wrapper">
              <input class="input-field" type="password" id="confirmPassword" placeholder="••••••••" required>
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</button>
            </div>
          </div>

          <button class="btn primary-btn" type="submit">
            Сохранить новый пароль
          </button>
        </form>
      </div>
    </div>

    <p class="demo-note">Защита игровых данных Beeja Project.</p>
  </main>

  <script>
    function showToast(message, type = 'error') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icon = type === 'error' ? '⚠️' : '✅';
      toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      if (field.type === 'password') {
        field.type = 'text';
        btn.textContent = '🙈';
      } else {
        field.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function validatePasswordInput(pwd) {
      const hintLength = document.getElementById('hintLength');
      const hintChars = document.getElementById('hintChars');

      const isValidLength = pwd.length >= 10 && pwd.length <= 128;
      hintLength.className = isValidLength ? 'valid' : '';
      hintLength.textContent = (isValidLength ? '✓' : '✕') + ' От 10 до 128 символов';

      const hasLatin = /[a-zA-Z]/.test(pwd);
      const hasDigit = /[0-9]/.test(pwd);
      const hasSpecial = /[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(pwd);
      const isValidChars = hasLatin && hasDigit && hasSpecial;

      hintChars.className = isValidChars ? 'valid' : '';
      hintChars.textContent = (isValidChars ? '✓' : '✕') + ' Латинская буква, цифра и спецсимвол';
    }

    function validatePasswordStrict(pwd) {
      if (pwd.length < 10 || pwd.length > 128) return 'Пароль должен быть от 10 до 128 символов';
      if (/[а-яА-ЯЁё]/.test(pwd)) return 'Кириллица в пароле запрещена';
      if (/[\s\t\n\r]/.test(pwd)) return 'Пароль не должен содержать пробелы';
      if (!/[a-zA-Z]/.test(pwd) || !/[0-9]/.test(pwd) || !/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(pwd)) {
        return 'Пароль должен содержать хотя бы одну латинскую букву, цифру и спецсимвол';
      }
      return null;
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        showToast('Отсутствует токен восстановления в ссылке', 'error');
        return;
      }

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      const pwdError = validatePasswordStrict(password);
      if (pwdError) {
        showToast(pwdError, 'error');
        return;
      }

      if (password !== confirmPassword) {
        showToast('Пароли не совпадают', 'error');
        return;
      }

      try {
        const response = await fetch('/api/v1/User/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            newPassword: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          showToast('Пароль успешно изменен!', 'success');
          setTimeout(() => {
            window.location.href = 'yandex.html';
          }, 1500);
        } else {
          showToast(data.message || 'Ошибка сброса пароля', 'error');
        }
      } catch (err) {
        showToast('Ошибка связи с сервером', 'error');
      }
    }
  </script>
</body>
</html>
