<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BeerJa — игрок</title>
<meta name="theme-color" content="#101116">
<meta name="beerja-api-base" content="/api/v1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#101116;--night:#191b22;--cloud:#f4f2ec;--fog:#9699a3;
 --pulse:#705cff;--signal:#c9ff47;--coral:#ff6b61;--gold:#ffc85a;
 --line:rgba(244,242,236,.14);--phone:430px;--pill:999px;
 --font:"Onest","Avenir Next","SF Pro Text",system-ui,sans-serif;
 --display:"Onest","Arial Rounded MT Bold","SF Pro Display",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07080b;color:var(--cloud);font-family:var(--font)}
body{overflow-x:hidden}
button{font:inherit}
button:disabled{opacity:.48;cursor:not-allowed}
#app{min-height:100vh}
.stage{width:100%;display:grid;justify-items:center}
.phone{position:relative;width:100%;max-width:var(--phone);min-height:100dvh;overflow:hidden;background:var(--ink)}
.phone::before{content:"";position:absolute;inset:0;z-index:0;background:
 linear-gradient(180deg,rgba(16,17,22,.08),rgba(16,17,22,.5) 40%,rgba(16,17,22,.98) 78%),
 var(--hero) center top/cover no-repeat}
.phone-content{position:relative;z-index:1;min-height:100dvh;padding:16px 16px 116px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:flex;align-items:center;gap:8px;max-width:78%;padding:9px 14px;border:1px solid var(--line);border-radius:var(--pill);background:rgba(16,17,22,.72);backdrop-filter:blur(16px);font-size:13px;font-weight:900}
.dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:var(--signal);box-shadow:0 0 20px rgba(201,255,71,.7)}
.round{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--signal);color:var(--ink);font:950 19px/1 var(--display)}
.hero{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:28px;background:rgba(16,17,22,.66);backdrop-filter:blur(18px)}
.kicker{color:rgba(244,242,236,.7);font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}
.hero h1{margin:7px 0 0;font:950 31px/.98 var(--display);letter-spacing:-.02em}
.hero p{margin:10px 0 0;color:rgba(244,242,236,.72);font-size:14px;line-height:1.42}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.metric{min-width:0;padding:10px 6px;text-align:center;border:1px solid var(--line);border-radius:18px;background:rgba(16,17,22,.7);backdrop-filter:blur(14px)}
.metric strong{display:block;font:950 19px/1 var(--display)}
.metric span{display:block;margin-top:5px;color:var(--fog);font-size:10px}
.surface{margin-top:12px;padding:16px;border:1px solid var(--line);border-radius:26px;background:rgba(16,17,22,.86);backdrop-filter:blur(22px)}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title-row strong{font-weight:950}
.title-row span{color:var(--fog);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}
.grid.one{grid-template-columns:1fr}
.card{width:100%;min-height:82px;padding:13px;border:1px solid var(--line);border-radius:22px;background:rgba(244,242,236,.055);color:var(--cloud);text-align:left}
.card.selected{background:var(--cloud);color:var(--ink);border-color:var(--cloud);transform:translateY(-1px)}
.card .mark{display:grid;place-items:center;width:32px;height:32px;margin-bottom:8px;border-radius:50%;background:rgba(244,242,236,.11);font-weight:950}
.card.selected .mark{background:transparent}
.card small{display:block;margin-top:5px;color:var(--fog);font-size:11px;line-height:1.3}
.card.selected small{color:rgba(16,17,22,.58)}
.list{display:grid;gap:8px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;min-height:58px;padding:12px 13px;border-radius:17px;background:rgba(244,242,236,.06)}
.row.current{background:rgba(201,255,71,.12);border:1px solid rgba(201,255,71,.25)}
.row .name{min-width:0;flex:1}
.row .name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name small{display:block;margin-top:3px;color:var(--fog);font-size:11px}
.row b{font:950 19px/1 var(--display)}
.choice{position:relative;min-height:90px;padding:14px 14px 14px 50px;border:1px solid var(--line);border-radius:22px;background:rgba(244,242,236,.055);color:var(--cloud);text-align:left}
.choice .num{position:absolute;left:13px;top:13px;display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:rgba(244,242,236,.1);font-weight:950}
.choice.selected{background:var(--cloud);color:var(--ink);border-color:var(--cloud)}
.choice.selected .num{background:transparent}
.choice.correct{border-color:var(--signal);background:rgba(201,255,71,.1)}
.choice-text{font-weight:850;line-height:1.32}
.notice{padding:14px;border-radius:18px;background:rgba(244,242,236,.055);color:var(--fog);font-size:13px;line-height:1.45}
.notice strong{display:block;color:var(--cloud);margin-bottom:4px}
.notice.ok{border:1px solid rgba(201,255,71,.25);background:rgba(201,255,71,.08);color:rgba(244,242,236,.8)}
.notice.ok strong{color:var(--signal)}
.notice.warn{border:1px solid rgba(255,107,97,.25);background:rgba(255,107,97,.08)}
.sticky{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;width:min(calc(100vw - 32px),398px);min-height:72px;display:grid;grid-template-columns:minmax(90px,.38fr) 1fr;gap:8px;padding:7px;transform:translateX(-50%);border:1px solid var(--line);border-radius:var(--pill);background:rgba(16,17,22,.9);backdrop-filter:blur(22px);box-shadow:0 22px 65px rgba(0,0,0,.45)}
.sticky-meta,.sticky-button{display:grid;place-items:center;min-height:58px;border-radius:var(--pill);font-weight:950;text-align:center}
.sticky-meta{background:rgba(244,242,236,.1);color:var(--cloud);padding:0 10px;font-size:12px}
.sticky-button{border:0;background:var(--signal);color:var(--ink);padding:0 14px}
.sticky-button.secondary{background:var(--cloud)}
.toast{position:fixed;top:max(15px,env(safe-area-inset-top));left:50%;z-index:50;width:min(calc(100vw - 32px),398px);padding:12px 16px;transform:translateX(-50%);border:1px solid var(--line);border-radius:var(--pill);background:rgba(16,17,22,.96);font-weight:850;text-align:center}
.loading{min-height:100dvh;display:grid;place-items:center;text-align:center}
.loader{width:32px;height:32px;margin:0 auto 12px;border:3px solid rgba(244,242,236,.18);border-top-color:var(--signal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:360px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

const API_BASE =
  document.querySelector('meta[name="beerja-api-base"]')?.content ||
  "/api/v1";

const ROOM_API_BASE = "/api/team-quiz";

const ASSETS = {
  lobby:"/assets/generated/quiz-lobby-night-v1-web.jpg",
  question:"/assets/generated/quiz-question-projector-v1-web.jpg",
  final:"/assets/generated/quiz-final-celebration-v1-web.jpg"
};

const params = new URLSearchParams(location.search);
const gameId = Number(params.get("gameId") || 0);

let state = {
  loading:true,
  error:"",
  gameId,
  game:null,
  player:null,
  team:null,
  captain:null,
  teams:[],
  players:[],
  question:null,
  answeredTeams:0,
  selectedAnswer:null,
  answerSubmitted:false,
  candidateCaptainId:null,
  captainVoteSubmitted:false,
  myTeams:[],
  joined:false,
  joining:false,
  toast:"",
  lastQuestionId:null
};

let pollTimer = null;
let toastTimer = null;
let refreshing = false;

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function normalizeOptions(value){
  if(Array.isArray(value)) return value.map(String);
  if(typeof value !== "string") return [];
  try{
    const parsed = JSON.parse(value);
    if(Array.isArray(parsed)) return parsed.map(String);
  }catch{}
  return value.split(",").map(x=>x.trim()).filter(Boolean);
}

function getToken(){
  return localStorage.getItem("token") ||
         localStorage.getItem("jwt") ||
         null;
}

async function request(path, options={}, base=API_BASE){
  const headers = {
    Accept:"application/json",
    ...(options.body ? {"Content-Type":"application/json"} : {}),
    ...(options.headers || {})
  };

  const token = getToken();
  if(token) headers.Authorization = `Bearer ${token}`;

  const response = await fetch(`${base}${path}`,{
    ...options,
    credentials:"same-origin",
    headers
  });

  const body = response.status === 204
    ? null
    : await response.json().catch(()=>null);

  if(!response.ok){
    throw new Error(
      body?.message ||
      body?.error ||
      `Ошибка ${response.status}`
    );
  }

  return body;
}

function normalizePhase(raw, step){
  const p = String(raw || "").trim();

  if(p === "lobby") return "lobby";
  if(p === "questionOpen" || p === "question_open") return "questionOpen";
  if(p === "questionClosed" || p === "question_closed") return "questionClosed";
  if(p === "reveal" || p === "revealQueue") return "revealQueue";
  if(p === "leaderboard") return "leaderboard";
  if(p === "final" || p === "finished") return "final";

  const s = String(step || "");
  if(s === "lobby") return "lobby";
  if(s === "reveal") return "revealQueue";
  if(s === "leaderboard") return "leaderboard";
  if(s === "finished") return "final";
  if(s === "question_closed") return "questionClosed";
  if(/^question_\d+$/i.test(s)) return "questionOpen";

  return "lobby";
}

function normalizeQuestion(raw){
  if(!raw) return null;

  return {
    id:Number(raw.id || 0),
    eventId:Number(raw.eventId || 0),
    questionText:raw.questionText || "",
    options:normalizeOptions(raw.options ?? raw.optionsJson),
    roundNumber:Number(raw.roundNumber || 1),
    stepOrder:Number(raw.stepOrder || 1),
    imageUrl:raw.imageUrl || ""
  };
}

function currentQuestionChanged(next){
  return Number(state.question?.id || 0) !== Number(next?.id || 0);
}

function applyState(data){
  const nextQuestion =
    normalizeQuestion(data?.question);

  const phase =
    normalizePhase(
      data?.phase,
      data?.currentStep
    );

  if(currentQuestionChanged(nextQuestion)){
    state.selectedAnswer = null;
    state.answerSubmitted = false;
  }

  state.game = {
    gameId:Number(data?.gameId || gameId),
    eventId:Number(data?.eventId || 0),
    gameType:Number(data?.gameType || 0),
    roomCode:data?.roomCode || "",
    isActive:Boolean(data?.isActive),
    currentStep:data?.currentStep || "lobby",
    phase
  };

  state.player = data?.player || null;
  state.team = data?.team || null;
  state.captain = data?.captain || null;
  state.teams = Array.isArray(data?.teams) ? data.teams : [];
  state.players = Array.isArray(data?.players) ? data.players : [];
  state.question = nextQuestion;
  state.answeredTeams = Number(data?.answeredTeams || 0);
  state.joined = Boolean(data?.player);

  if(state.player?.hasAnswered === true){
    state.answerSubmitted = true;
  }

  if(
    state.player?.selectedAnswerIndex !== undefined &&
    state.player?.selectedAnswerIndex !== null &&
    state.question?.options?.length
  ){
    const i = Number(state.player.selectedAnswerIndex);
    if(i >= 0 && i < state.question.options.length){
      state.selectedAnswer = state.question.options[i];
    }
  }

  if(data?.player?.hasVotedCaptain === true){
    state.captainVoteSubmitted = true;
  }

  if(
    phase !== "questionOpen" &&
    phase !== "questionClosed"
  ){
    state.selectedAnswer =
      phase === "questionOpen"
        ? state.selectedAnswer
        : state.selectedAnswer;
  }

  state.lastQuestionId =
    state.question?.id || state.lastQuestionId;

  state.error = "";
}

async function loadState(){
  if(!gameId || gameId < 1){
    state.loading = false;
    state.error = "В URL не указан gameId.";
    render();
    return;
  }

  if(refreshing) return;
  refreshing = true;

  try{
    const data =
      await request(`/games/${gameId}/state`);

    applyState(data);

    /*
      Если игрок ещё не вошёл в игру, получаем его
      доступные команды через реальный endpoint
      /api/team-quiz/my-teams.
    */
    if(!state.joined && state.game?.phase === "lobby"){
      try{
        const teams =
          await request("/my-teams",{},ROOM_API_BASE);

        state.myTeams =
          Array.isArray(teams) ? teams : [];
      }catch{
        state.myTeams = [];
      }
    }

    state.loading = false;
  }catch(error){
    state.loading = false;
    state.error =
      error?.message ||
      "Не удалось получить состояние игры.";
  }finally{
    refreshing = false;
    render();
  }
}

async function joinRoom(teamId){
  if(!teamId || state.joining) return;

  const code =
    state.game?.roomCode ||
    "";

  if(!code){
    toast("Код комнаты ещё не получен");
    return;
  }

  state.joining = true;
  render();

  try{
    await request("/join-room",{
      method:"POST",
      body:JSON.stringify({
        GameCode:code,
        TeamId:Number(teamId)
      })
    },ROOM_API_BASE);

    state.joined = true;
    toast("Вы вошли в игру");
    await loadState();
  }catch(error){
    state.error =
      error?.message ||
      "Не удалось войти в комнату.";
    toast(state.error);
  }finally{
    state.joining = false;
    render();
  }
}

async function selectTeam(teamId){
  if(!teamId) return;

  try{
    await request(`/games/${gameId}/select-team`,{
      method:"POST",
      body:JSON.stringify({
        TeamId:Number(teamId)
      })
    });

    toast("Команда выбрана");
    await loadState();
  }catch(error){
    toast(
      error?.message ||
      "Не удалось выбрать команду"
    );
  }
}

async function submitCaptainVote(){
  const candidate =
    Number(state.candidateCaptainId || 0);

  if(!candidate){
    toast("Выберите капитана");
    return;
  }

  try{
    await request(`/games/${gameId}/captain-votes`,{
      method:"POST",
      body:JSON.stringify({
        CaptainUserId:candidate
      })
    });

    state.captainVoteSubmitted = true;
    toast("Голос за капитана учтён");
    await loadState();
  }catch(error){
    toast(
      error?.message ||
      "Не удалось отправить голос"
    );
  }
}

async function submitAnswer(){
  const q = state.question;

  if(!q){
    toast("Вопрос ещё не загружен");
    return;
  }

  if(state.game?.phase !== "questionOpen"){
    toast("Приём ответов закрыт");
    return;
  }

  if(!state.player?.isCaptain){
    toast("Ответ отправляет только капитан");
    return;
  }

  if(state.answerSubmitted){
    toast("Ответ уже отправлен");
    return;
  }

  if(
    state.selectedAnswer === null ||
    state.selectedAnswer === undefined
  ){
    toast("Выберите вариант ответа");
    return;
  }

  /*
    ВАЖНО:
    текущий backend TeamAnswerDto принимает Answer:string.
    Он сам определяет QuestionId из CurrentStep.
    Поэтому отправляем ТЕКСТ варианта, а не QuestionId/AnswerIndex.
  */
  try{
    await request(`/games/${gameId}/answers`,{
      method:"POST",
      body:JSON.stringify({
        Answer:String(state.selectedAnswer)
      })
    });

    state.answerSubmitted = true;
    toast("Ответ зафиксирован");
    await loadState();
  }catch(error){
    toast(
      error?.message ||
      "Не удалось отправить ответ"
    );
  }
}

function toast(message){
  state.toast = String(message || "");
  render();

  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    state.toast = "";
    render();
  },2200);
}

function heroForPhase(){
  const p = state.game?.phase;

  if(p === "questionOpen" ||
     p === "questionClosed" ||
     p === "revealQueue")
    return ASSETS.question;

  if(p === "final" ||
     p === "leaderboard")
    return ASSETS.final;

  return ASSETS.lobby;
}

function renderMetrics(){
  const q = state.question;

  return `
    <div class="metrics">
      <div class="metric">
        <strong>${q?.roundNumber || "—"}</strong>
        <span>раунд</span>
      </div>
      <div class="metric">
        <strong>${q?.stepOrder || "—"}</strong>
        <span>вопрос</span>
      </div>
      <div class="metric">
        <strong>${state.teams.length}</strong>
        <span>команд</span>
      </div>
      <div class="metric">
        <strong>${state.answeredTeams}</strong>
        <span>ответили</span>
      </div>
    </div>
  `;
}

function renderJoin(){
  if(state.joined) return "";

  if(!state.myTeams.length){
    return `
      <section class="surface">
        <div class="notice warn">
          <strong>Нет доступных команд</strong>
          В вашем аккаунте нет принятого
          участия в командах. Сначала вступите
          в команду, затем возвращайтесь в игру.
        </div>
      </section>
    `;
  }

  return `
    <section class="surface">
      <div class="title-row">
        <strong>Войти в игру</strong>
        <span>${state.myTeams.length} команд</span>
      </div>

      <div class="grid one">
        ${
          state.myTeams.map(team=>`
            <button
              class="card"
              data-join-team="${Number(team.id)}"
              ${state.joining ? "disabled" : ""}
            >
              <div class="mark">→</div>
              <strong>${esc(team.name)}</strong>
              <small>Войти этой командой</small>
            </button>
          `).join("")
        }
      </div>
    </section>
  `;
}

function renderTeam(){
  const team = state.team;

  return `
    <section class="surface">
      <div class="title-row">
        <strong>
          ${esc(team?.name || "Команда не выбрана")}
        </strong>
        <span>
          ${state.players.filter(
            p=>Number(p.teamId) === Number(team?.id)
          ).length} игроков
        </span>
      </div>

      ${
        team
          ? `
            <div class="list">
              ${
                state.players
                  .filter(
                    p=>Number(p.teamId) === Number(team.id)
                  )
                  .map(p=>`
                    <div class="row">
                      <div class="name">
                        <strong>${esc(p.username)}</strong>
                        <small>
                          ${
                            p.isCaptain
                              ? "Капитан"
                              : "Участник"
                          }
                        </small>
                      </div>
                      ${
                        p.isCaptain
                          ? "<b>★</b>"
                          : ""
                      }
                    </div>
                  `).join("")
              }
            </div>
          `
          : `
            <div class="notice" style="margin-top:12px">
              Команда ещё не выбрана.
            </div>
          `
      }
    </section>
  `;
}

function renderCaptainVote(){
  if(!state.team) return "";

  const members =
    state.players.filter(
      p=>Number(p.teamId) === Number(state.team.id)
    );

  if(!members.length) return "";

  const currentCaptainId =
    Number(state.captain?.id || 0);

  return `
    <section class="surface">
      <div class="title-row">
        <strong>Выбор капитана</strong>
        <span>
          ${
            currentCaptainId
              ? "капитан выбран"
              : "нужно выбрать"
          }
        </span>
      </div>

      <div class="grid">
        ${
          members.map(p=>{
            const selected =
              Number(state.candidateCaptainId) === Number(p.id) ||
              (
                !state.candidateCaptainId &&
                currentCaptainId === Number(p.id)
              );

            return `
              <button
                class="card ${selected ? "selected" : ""}"
                data-captain-id="${Number(p.id)}"
                ${
                  state.captainVoteSubmitted ||
                  state.game?.phase !== "lobby"
                    ? "disabled"
                    : ""
                }
              >
                <div class="mark">
                  ${selected ? "✓" : "＋"}
                </div>

                <strong>
                  ${esc(p.username)}
                </strong>

                <small>
                  ${
                    p.isCaptain
                      ? "Текущий капитан"
                      : "Участник команды"
                  }
                </small>
              </button>
            `;
          }).join("")
        }
      </div>
    </section>
  `;
}

function renderQuestion(){
  const q = state.question;

  if(!q){
    return `
      <section class="surface">
        <div class="notice">
          <strong>Ждём вопрос</strong>
          Ведущий ещё не открыл следующий вопрос.
        </div>
      </section>
    `;
  }

  const open =
    state.game?.phase === "questionOpen";

  const closed =
    state.game?.phase === "questionClosed";

  const reveal =
    state.game?.phase === "revealQueue";

  return `
    <section class="surface">
      <div class="title-row">
        <strong>
          Раунд ${q.roundNumber} · Вопрос ${q.stepOrder}
        </strong>
        <span>
          ${
            open
              ? "ответы открыты"
              : closed
                ? "ответы закрыты"
                : reveal
                  ? "разбор"
                  : ""
          }
        </span>
      </div>

      <div
        style="
          margin-top:13px;
          font:900 25px/1.08 var(--display)
        "
      >
        ${esc(q.questionText)}
      </div>

      ${
        q.imageUrl
          ? `
            <img
              src="${esc(q.imageUrl)}"
              alt=""
              style="
                display:block;
                width:100%;
                max-height:280px;
                object-fit:cover;
                margin-top:14px;
                border-radius:18px
              "
            >
          `
          : ""
      }

      <div class="grid one">
        ${
          q.options.map((option,index)=>{
            const selected =
              state.selectedAnswer === option;

            return `
              <button
                class="
                  choice
                  ${selected ? "selected" : ""}
                "
                data-answer-index="${index}"
                ${
                  !open ||
                  !state.player?.isCaptain ||
                  state.answerSubmitted
                    ? "disabled"
                    : ""
                }
              >
                <span class="num">
                  ${selected ? "✓" : index + 1}
                </span>

                <span class="choice-text">
                  ${esc(option)}
                </span>
              </button>
            `;
          }).join("")
        }
      </div>

      ${
        state.answerSubmitted
          ? `
            <div class="notice ok" style="margin-top:12px">
              <strong>Ответ принят</strong>
              Ответ команды уже зафиксирован.
            </div>
          `
          : ""
      }

      ${
        !state.player?.isCaptain &&
        open
          ? `
            <div class="notice" style="margin-top:12px">
              <strong>Отвечает капитан</strong>
              Обсудите вариант с командой,
              но отправить его может только капитан.
            </div>
          `
          : ""
      }

      ${
        closed
          ? `
            <div class="notice" style="margin-top:12px">
              <strong>Ответы закрыты</strong>
              Ждём разбора ведущего.
            </div>
          `
          : ""
      }

      ${
        reveal
          ? `
            <div class="notice" style="margin-top:12px">
              <strong>Разбор вопроса</strong>
              Ведущий показывает результаты.
            </div>
          `
          : ""
      }
    </section>
  `;
}

function renderLeaderboard(){
  if(!state.teams.length) return "";

  const rows =
    [...state.teams].sort(
      (a,b)=>Number(b.score||0)-Number(a.score||0)
    );

  return `
    <section class="surface">
      <div class="title-row">
        <strong>Таблица команд</strong>
        <span>общий счёт</span>
      </div>

      <div class="list">
        ${
          rows.map((team,index)=>`
            <div
              class="
                row
                ${
                  Number(team.id) === Number(state.team?.id)
                    ? "current"
                    : ""
                }
              "
            >
              <div class="name">
                <strong>
                  #${index+1} ${esc(team.name)}
                </strong>
                <small>
                  ${Number(team.connected||0)} игроков
                </small>
              </div>
              <b>${Number(team.score||0)}</b>
            </div>
          `).join("")
        }
      </div>
    </section>
  `;
}

function renderLobby(){
  if(!state.joined){
    return renderJoin();
  }

  return `
    ${renderTeam()}
    ${renderCaptainVote()}

    <section class="surface">
      <div class="notice">
        <strong>Ждём ведущего</strong>
        Когда все готовы, ведущий запустит игру.
      </div>
    </section>

    ${
      state.captain?.id
        ? `
          <div class="sticky">
            <div class="sticky-meta">
              Капитан<br>
              ${esc(state.captain.username || "выбран")}
            </div>

            <div class="sticky-button secondary">
              ✓ Капитан выбран
            </div>
          </div>
        `
        : state.team
          ? `
            <div class="sticky">
              <div class="sticky-meta">голос</div>
              <button
                class="sticky-button"
                id="btnCaptain"
                ${
                  !state.candidateCaptainId ||
                  state.captainVoteSubmitted
                    ? "disabled"
                    : ""
                }
              >
                ${
                  state.captainVoteSubmitted
                    ? "✓ Голос принят"
                    : "Выбрать капитана"
                }
              </button>
            </div>
          `
          : ""
    }
  `;
}

function renderQuestionSticky(){
  const open =
    state.game?.phase === "questionOpen";

  const captain =
    Boolean(state.player?.isCaptain);

  if(!open) return "";

  if(!captain){
    return `
      <div class="sticky">
        <div class="sticky-meta">вопрос</div>
        <div class="sticky-button secondary">
          Отвечает капитан
        </div>
      </div>
    `;
  }

  return `
    <div class="sticky">
      <div class="sticky-meta">
        ${
          state.answerSubmitted
            ? "принято"
            : "выбор"
        }
      </div>

      <button
        class="sticky-button"
        id="btnAnswer"
        ${
          state.selectedAnswer === null ||
          state.answerSubmitted
            ? "disabled"
            : ""
        }
      >
        ${
          state.answerSubmitted
            ? "✓ Ответ отправлен"
            : "Отправить ответ"
        }
      </button>
    </div>
  `;
}

function renderFinal(){
  return `
    ${renderLeaderboard()}

    <div class="sticky">
      <div class="sticky-meta">финал</div>
      <div class="sticky-button secondary">
        Игра завершена
      </div>
    </div>
  `;
}

function renderMain(){
  const p = state.game?.phase || "lobby";

  if(p === "lobby")
    return renderLobby();

  if(
    p === "questionOpen" ||
    p === "questionClosed" ||
    p === "revealQueue"
  ){
    return `
      ${renderQuestion()}
      ${renderQuestionSticky()}
    `;
  }

  if(p === "leaderboard" || p === "final")
    return renderFinal();

  return `
    <section class="surface">
      <div class="notice">
        <strong>Ждём ведущего</strong>
        Следующий этап появится автоматически.
      </div>
    </section>
  `;
}

function render(){
  const app = document.getElementById("app");

  if(!app){
    console.error("BeerJa player: #app not found");
    return;
  }

  if(state.loading){
    app.innerHTML = `
      <main class="stage">
        <div
          class="phone"
          style="--hero:url('${ASSETS.lobby}')"
        >
          <div class="phone-content loading">
            <div>
              <div class="loader"></div>
              <strong>Подключаемся к игре…</strong>
            </div>
          </div>
        </div>
      </main>
    `;
    return;
  }

  if(state.error){
    app.innerHTML = `
      <main class="stage">
        <div
          class="phone"
          style="--hero:url('${ASSETS.lobby}')"
        >
          <div class="phone-content">
            <div class="hero">
              <div class="kicker">Ошибка</div>
              <h1>Не удалось загрузить игру</h1>
              <p>${esc(state.error)}</p>
            </div>

            <section class="surface">
              <div class="notice warn">
                <strong>Проверьте подключение</strong>
                Убедитесь, что вы авторизованы
                и gameId существует.
              </div>
            </section>

            <div class="sticky">
              <div class="sticky-meta">API</div>
              <button
                class="sticky-button"
                id="btnRetry"
              >
                Повторить
              </button>
            </div>
          </div>
        </div>
      </main>
    `;
    return;
  }

  const p = state.game?.phase || "lobby";
  const q = state.question;

  let title = "Ждём ведущего";
  let kicker = "BeerJa";
  let text = "Подключение к игровой сессии.";

  if(p === "lobby"){
    title =
      state.joined
        ? (state.team?.name || "Ваша команда")
        : "Вход в игру";

    kicker =
      state.game?.roomCode
        ? `Комната ${state.game.roomCode}`
        : "Лобби";

    text =
      state.joined
        ? "Вы в игре. Выберите капитана и ждите старта."
        : "Выберите команду и войдите в игровую комнату.";
  }
  else if(p === "questionOpen"){
    title =
      state.player?.isCaptain
        ? "Выберите ответ"
        : "Отвечает капитан";

    kicker =
      `Раунд ${q?.roundNumber || "—"} · вопрос ${q?.stepOrder || "—"}`;

    text =
      state.player?.isCaptain
        ? "Выберите один вариант и отправьте его команде."
        : "Обсуждайте вопрос вместе с командой.";
  }
  else if(p === "questionClosed"){
    title = "Ответы закрыты";
    kicker =
      `Раунд ${q?.roundNumber || "—"} · вопрос ${q?.stepOrder || "—"}`;
    text = "Ждём разбора ведущего.";
  }
  else if(p === "revealQueue"){
    title = "Разбор";
    kicker =
      `Раунд ${q?.roundNumber || "—"} · вопрос ${q?.stepOrder || "—"}`;
    text = "Ведущий показывает результат вопроса.";
  }
  else if(p === "leaderboard"){
    title = "Результаты";
    kicker = "Таблица команд";
    text = "Ждём следующий этап.";
  }
  else if(p === "final"){
    title = "Игра завершена";
    kicker = "Финал";
    text = "Спасибо за игру!";
  }

  app.innerHTML = `
    <main class="stage">
      <div
        class="phone"
        style="--hero:url('${heroForPhase()}')"
      >
        <div class="phone-content">

          <div class="topbar">
            <div class="chip">
              <span class="dot"></span>
              <span>
                ${esc(
                  state.game?.roomCode
                    ? `Комната ${state.game.roomCode}`
                    : "BeerJa"
                )}
              </span>
            </div>

            <div class="round">
              ${
                q?.roundNumber ||
                (p === "lobby" ? "L" : "•")
              }
            </div>
          </div>

          <div class="hero">
            <div class="kicker">
              ${esc(kicker)}
            </div>

            <h1>
              ${esc(title)}
            </h1>

            <p>
              ${esc(text)}
            </p>
          </div>

          ${renderMetrics()}
          ${renderMain()}

          ${
            state.toast
              ? `<div class="toast">${esc(state.toast)}</div>`
              : ""
          }
        </div>
      </div>
    </main>
  `;
}

document.addEventListener("click", async event=>{
  const join =
    event.target.closest("[data-join-team]");

  if(join){
    await joinRoom(
      Number(join.dataset.joinTeam)
    );
    return;
  }

  const captain =
    event.target.closest("[data-captain-id]");

  if(captain){
    if(
      state.captainVoteSubmitted ||
      state.game?.phase !== "lobby"
    ) return;

    state.candidateCaptainId =
      Number(captain.dataset.captainId);

    render();
    return;
  }

  if(event.target.closest("#btnCaptain")){
    await submitCaptainVote();
    return;
  }

  const answer =
    event.target.closest("[data-answer-index]");

  if(answer){
    if(
      state.game?.phase !== "questionOpen" ||
      !state.player?.isCaptain ||
      state.answerSubmitted
    ) return;

    const index =
      Number(answer.dataset.answerIndex);

    const option =
      state.question?.options?.[index];

    if(option === undefined) return;

    state.selectedAnswer = option;
    render();
    return;
  }

  if(event.target.closest("#btnAnswer")){
    await submitAnswer();
    return;
  }

  if(event.target.closest("#btnRetry")){
    state.error = "";
    state.loading = true;
    render();
    await loadState();
  }
});

async function boot(){
  render();
  await loadState();

  clearInterval(pollTimer);
  pollTimer =
    setInterval(loadState,1000);
}

boot();
</script>
</body>
</html>
