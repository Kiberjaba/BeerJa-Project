<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>БИРЖА — мои игры</title>

<style>
:root {
    --bg: #0b0c0d;
    --card: #17181a;
    --card-2: #1e2021;
    --border: #2a2c2e;
    --lime: #c6ff3d;
    --text: #f2f2f0;
    --text-dim: #9a9d9c;
    --text-faint: #6c6f6e;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

a {
    color: inherit;
    text-decoration: none;
}

.wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px;
}

header {
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(11, 12, 13, 0.9);
    backdrop-filter: blur(8px);
}

.nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    gap: 16px;
    flex-wrap: wrap;
}

.nav-left {
    font-weight: 900;
    font-size: 14px;
    letter-spacing: .06em;
    display: flex;
    align-items: center;
    gap: 8px;
}

.nav-left .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 8px var(--lime);
}

.nav-right {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
}

main {
    padding: 48px 0 80px;
}

.eyebrow {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 10px;
}

h1 {
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 36px;
    max-width: 600px;
}

.game-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.game-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;

    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;

    padding: 22px 26px;

    transition: border-color .15s, background .15s;
}

.game-row.enabled:hover {
    border-color: var(--text-faint);
    background: var(--card-2);
}

.game-name {
    font-size: 19px;
    font-weight: 800;
    line-height: 1.3;
}

.game-meta {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 4px;
    font-weight: 600;
}

.btn-lime {
    background: var(--lime);
    color: #10130a;
    border: none;
    padding: 13px 24px;

    border-radius: 999px;

    font-weight: 800;
    font-size: 13px;

    cursor: pointer;
    white-space: nowrap;

    transition: transform .15s ease;
}

.btn-lime:hover:not(:disabled) {
    transform: translateY(-2px);
}

.btn-lime:disabled {
    opacity: .5;
    cursor: not-allowed;
}
</style>

</head>

<body>

<header>
    <div class="wrap nav">

        <a href="dashboard.html" class="nav-left">
            <span class="dot"></span>
            БИРЖА
        </a>

        <span class="nav-right">
            Кабинет ведущего
        </span>

    </div>
</header>

<main class="wrap">

    <div class="eyebrow">Ваши игры</div>

    <h1>Выберите игру для запуска</h1>

    <div class="game-list" id="gameListContainer">
    </div>

</main>


<script>

const token = localStorage.getItem("token");


function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;"
    }[c]));
}


async function loadUserGames() {

    if (!token) {
        window.location.href = "/ved/yandex.html";
        return;
    }

    const container =
        document.getElementById("gameListContainer");

    try {

        const response = await fetch(
            "/api/niche-game/my-games",
            {
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );


        if (response.status === 401) {
            window.location.href = "/ved/yandex.html";
            return;
        }


        if (!response.ok) {
            throw new Error("Ошибка загрузки данных");
        }


        const games = await response.json();


        container.innerHTML = "";


        if (!games.length) {

            container.innerHTML = `
                <div style="color: var(--text-faint);">
                    У вас пока нет подготовленных игр.
                </div>
            `;

            return;
        }


        games.forEach(game => {

            const row =
                document.createElement("div");

            row.className =
                "game-row enabled";


            row.innerHTML = `

                <div>

                    <div class="game-name">
                        ${escapeHtml(
                            game.title ||
                            "Кто хочет стать нишевым"
                        )}
                    </div>

                    <div class="game-meta">
                        ${escapeHtml(game.meta || "")}
                    </div>

                </div>


                <button
                    class="btn-lime"
                    data-event-id="${game.eventId}"
                >
                    Запустить
                </button>

            `;


            container.appendChild(row);

        });


        container
            .querySelectorAll(".btn-lime")
            .forEach(btn => {

                btn.addEventListener(
                    "click",
                    () => startGame(btn)
                );

            });


    }
    catch (err) {

        console.error(err);

        container.innerHTML = `
            <div style="color:#ff6b6b;">
                Не удалось загрузить ваши игры.
                Попробуйте обновить страницу.
            </div>
        `;

    }

}



async function startGame(btn) {

    const eventId =
        btn.dataset.eventId;


    if (!eventId) {

        alert("Не удалось определить ID события");

        return;
    }


    const originalText =
        btn.textContent;


    btn.disabled = true;

    btn.textContent =
        "Создаём комнату...";


    try {

        const response = await fetch(

            `/api/niche-game/start-session/${eventId}`,

            {
                method: "POST",

                headers: {
                    "Authorization":
                        "Bearer " + token,

                    "Content-Type":
                        "application/json"
                }
            }

        );


        if (response.status === 401) {

            window.location.href =
                "/ved/yandex.html";

            return;
        }


        if (!response.ok) {

            const errorData =
                await response.json()
                .catch(() => null);


            throw new Error(

                errorData?.message ||
                `Ошибка запуска игры: ${response.status}`

            );

        }


        const data =
            await response.json();


        console.log(
            "Игровая сессия создана:",
            data
        );


        if (!data.gameId) {

            throw new Error(
                "Сервер не вернул gameId"
            );

        }


        window.location.href =

            `/Game/GameLobbi.html` +
            `?gameId=${encodeURIComponent(data.gameId)}` +
            `&eventId=${encodeURIComponent(eventId)}` +
            `&roomCode=${encodeURIComponent(data.roomCode || "")}`;


    }
    catch (err) {

        console.error(err);


        alert(
            err.message ||
            "Не удалось запустить игру"
        );


        btn.disabled = false;

        btn.textContent =
            originalText;

    }

}


loadUserGames();

</script>

</body>
</html>
