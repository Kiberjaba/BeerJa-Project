<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поиск игр и игроков</title>
<style>
  :root{
    --bg:#0b0c0d; --card:#17181a; --card-2:#1e2021; --border:#2a2c2e;
    --lime:#c6ff3d; --text:#f2f2f0; --text-dim:#9a9d9c; --text-faint:#6c6f6e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

  header{ border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; background:rgba(11,12,13,0.9); backdrop-filter:blur(8px); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; gap:16px; flex-wrap:wrap; }
  .nav-left{ font-weight:900; font-size:14px; letter-spacing:.06em; display:flex; align-items:center; gap:8px; }
  .nav-left .dot{ width:8px; height:8px; border-radius:50%; background:var(--lime); box-shadow:0 0 8px var(--lime); }
  .nav-right{ display:flex; gap:24px; flex-wrap:wrap; font-size:13px; font-weight:600; color:var(--text-dim); }
  .nav-right a:hover{ color:var(--lime); }
  .nav-right a.active{ color:var(--lime); }
  .nav-toggle{ display:none; }

  section{ padding:48px 0 64px; }
  .eyebrow{ font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--lime); margin-bottom:10px; text-align:center; }
  h1{ font-size:clamp(28px,5vw,38px); font-weight:900; line-height:1.1; margin-bottom:28px; text-align:center; }

  .tabs{ display:flex; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:6px; max-width:320px; margin:0 auto 24px; }
  .tab{ flex:1; text-align:center; padding:11px 0; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer; color:var(--text-dim); }
  .tab.active{ background:var(--lime); color:#10130a; }

  .search-bar{ display:flex; gap:10px; margin-bottom:16px; max-width:900px; margin-left:auto; margin-right:auto; }
  .search-input{ flex:1; background:var(--card); border:1px solid var(--border); color:var(--text); padding:14px 18px; border-radius:14px; font-size:14px; }
  .search-input:focus{ outline:none; border-color:var(--lime); }
  .search-btn{ background:var(--lime); color:#10130a; border:none; padding:0 22px; border-radius:14px; font-weight:800; font-size:13px; cursor:pointer; }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px; max-width:900px; margin-left:auto; margin-right:auto; }
  .chip{ background:var(--card); border:1px solid var(--border); padding:8px 16px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; color:var(--text-dim); }
  .chip.active, .chip:hover{ border-color:var(--lime); color:var(--lime); }

  .results{ display:flex; flex-direction:column; gap:12px; max-width:900px; margin-left:auto; margin-right:auto; }

  /* game result row */
  .g-row{ display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px; }
  .g-thumb{ width:76px; height:76px; border-radius:14px; flex-shrink:0; background:linear-gradient(135deg,var(--card-2),#232520); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:10px; font-weight:700; }
  .g-body{ flex:1; min-width:0; }
  .g-title{ font-size:15px; font-weight:800; }
  .g-meta{ font-size:12px; color:var(--text-faint); margin-top:4px; }
  .g-price{ font-size:14px; font-weight:900; }
  .btn-sm{ background:var(--lime); color:#10130a; border:none; padding:10px 18px; border-radius:999px; font-weight:800; font-size:12px; cursor:pointer; }

  /* player result row */
  .p-row{ display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px; }
  .p-avatar{
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#3a3f2a,#1c1e16);
    border:2px solid var(--lime);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:var(--lime); font-size:16px;
    overflow:hidden; /* чтобы фото аккуратно обрезалось по кругу */
  }
  .p-avatar img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .p-body{ flex:1; min-width:0; }
  .p-name{ font-size:15px; font-weight:800; }
  .p-meta{ font-size:12px; color:var(--text-faint); margin-top:4px; }
  .p-level{ font-size:12px; font-weight:800; color:var(--lime); background:rgba(198,255,61,0.1); padding:5px 10px; border-radius:999px; }
  .btn-outline-sm{ background:transparent; border:1px solid var(--border); color:var(--text); padding:9px 16px; border-radius:999px; font-weight:800; font-size:12px; cursor:pointer; }
  .btn-outline-sm:hover{ border-color:var(--lime); color:var(--lime); }

  /* Модальное окно / блок приглашения */
  .invite-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:100; align-items:center; justify-content:center; padding:18px; }
  .invite-content { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:24px; width:100%; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
  .invite-title { font-size:16px; font-weight:800; margin-bottom:14px; }
  .invite-input { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); padding:12px 16px; border-radius:12px; font-size:14px; margin-bottom:14px; }
  .invite-input:focus { outline:none; border-color:var(--lime); }
  .invite-actions { display:flex; gap:10px; justify-content:flex-end; }
  .invite-msg { font-size:12px; margin-bottom:10px; min-height:16px; }

  footer{ border-top:1px solid var(--border); padding:40px 0; margin-top: 40px; }
  .footer-row{ display:flex; align-items:center; justify-content:center; gap:40px; flex-wrap:wrap; }
  .footer-links{ display:flex; gap:32px; font-size:13px; font-weight:700; color:var(--text-dim); }
  .footer-links a:hover{ color:var(--lime); }
  .footer-logo{ width:56px; height:56px; display:flex; align-items:center; justify-content:center; border-radius:50%; overflow:hidden; transition: transform 0.2s ease; }
  .footer-logo img { width: 100%; height: 100%; object-fit: cover; }
  .footer-logo:hover{ transform: scale(1.05); }

  @media (max-width:560px){
    .nav-right{ display:none; width:100%; flex-direction:column; gap:14px; padding-top:14px; }
    .nav-right.open{ display:flex; }
    .nav-toggle{ display:block; background:none; border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:8px; font-size:16px; cursor:pointer; }
    .wrap{ padding:0 18px; }
    section{ padding:40px 0; }
    .footer-row{ flex-direction:column; gap:20px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="glav.html" class="nav-left"><span class="dot"></span>БИРЖА</a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-right').classList.toggle('open')">☰</button>
    <nav class="nav-right">
      <a href="glav.html">Игры</a>
      <a href="Blog.html">Блог</a>
      <a href="Search.html" class="active">Поиск игр/игроков</a>
      <a href="Help.html">Помощь</a>
      <a href="about.html">О нас</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="eyebrow">Поиск</div>
    <h1>Найдите игру или партнёра по игре</h1>

    <div class="tabs">
      <div class="tab active" id="tab-games" onclick="setTab('games')">Игры</div>
      <div class="tab" id="tab-players" onclick="setTab('players')">Игроки</div>
    </div>

    <div class="search-bar">
      <input class="search-input" id="search-input" type="text" placeholder="Например: киноквиз, Майя...">
      <button class="search-btn">Найти</button>
    </div>

    <!-- Фильтры игр -->
    <div class="filters" id="filters-games">
      <div class="chip active">Все города</div>
      <div class="chip">Ближайшие даты</div>
    </div>

    <!-- Фильтры игроков -->
    <div class="filters" id="filters-players" style="display:none;">
      <div class="chip active" onclick="filterPlayers('all', this)">Все уровни</div>
      <div class="chip" onclick="filterPlayers('looking', this)">Ищут команду</div>
    </div>

    <!-- Результаты игр -->
    <div class="results" id="results-games">
      <div class="g-row">
        <div class="g-thumb">ФОТО</div>
        <div class="g-body"><div class="g-title">Киновечер: крупный план</div><div class="g-meta">Москва · 6–12 команд · 90 мин</div></div>
        <div class="g-price">от 8 000 ₽</div>
        <button class="btn-sm">Заказать</button>
      </div>
    </div>

    <!-- Результаты игроков (Динамические из БД) -->
    <div class="results" id="results-players" style="display:none;">
      <!-- Сюда подгружаются игроки через JS -->
    </div>
  </div>
</section>

<!-- Модальное окно приглашения игрока -->
<div class="invite-modal" id="inviteModal">
  <div class="invite-content">
    <div class="invite-title" id="inviteTitle">Пригласить игрока</div>
    <div class="invite-msg" id="inviteMsg" style="color:var(--text-faint);">Выберите вашу команду:</div>
    <!-- Заменено на select для выбора созданной команды по ID -->
    <select class="invite-input" id="teamSelect">
      <option value="">Загрузка ваших команд...</option>
    </select>
    <div class="invite-actions">
      <button class="btn-outline-sm" onclick="closeInviteModal()">Отмена</button>
      <button class="btn-sm" onclick="sendInvitation()">Отправить</button>
    </div>
  </div>
</div>

<footer>
  <div class="wrap footer-row">
    <a href="/" class="footer-logo">
      <img src="Code_Generated_Image.png" alt="БИРЖА Логотип">
    </a>
    <div class="footer-links">
      <a href="https://t.me/LUSTRECASTLE" target="_blank">Чатик</a>
      <a href="https://t.me/LUSTRECASTLE" target="_blank">Блог</a>
    </div>
  </div>
</footer>

<script>
  const API_HOST = ''; // как в lichved.html — если фронт и бэк на одном домене, оставляем пустым

  let currentFilter = 'all';
  let targetPlayerId = null;
  let lastScrollTop = window.pageYOffset || document.documentElement.scrollTop;

  function setTab(tab){
    const games = tab === 'games';
    document.getElementById('tab-games').classList.toggle('active', games);
    document.getElementById('tab-players').classList.toggle('active', !games);
    document.getElementById('filters-games').style.display = games ? 'flex' : 'none';
    document.getElementById('filters-players').style.display = games ? 'none' : 'flex';
    document.getElementById('results-games').style.display = games ? 'flex' : 'none';
    document.getElementById('results-players').style.display = games ? 'none' : 'flex';
    
    if(!games) {
      loadPlayers(currentFilter);
    }
  }

  function filterPlayers(type, element) {
    document.querySelectorAll('#filters-players .chip').forEach(c => c.classList.remove('active'));
    element.classList.add('active');
    currentFilter = type;
    loadPlayers(type);
  }

  async function openInviteModal(userId, username) {
    targetPlayerId = userId;
    document.getElementById('inviteTitle').innerText = `Пригласить игрока ${username}`;
    const selectEl = document.getElementById('teamSelect');
    const msgEl = document.getElementById('inviteMsg');

    selectEl.innerHTML = '<option value="">Загрузка команд...</option>';
    document.getElementById('inviteModal').style.display = 'flex';

    const token = localStorage.getItem('token') || localStorage.getItem('authToken');

    try {
      const response = await fetch('/api/teams/my-teams', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!response.ok) throw new Error('Не удалось загрузить список команд');

      const teams = await response.json();
      const myCreatedTeams = teams.filter(t => t.isCreator && t.status === 'accepted');

      if (myCreatedTeams.length === 0) {
        selectEl.innerHTML = '<option value="">У вас нет созданных команд</option>';
        msgEl.style.color = '#ff5c5c';
        msgEl.innerText = 'Сначала создайте команду в профиле!';
        return;
      }

      msgEl.style.color = 'var(--text-faint)';
      msgEl.innerText = 'Выберите команду из списка:';
      
      selectEl.innerHTML = myCreatedTeams.map(t => 
        `<option value="${t.teamId}">${t.teamName}</option>`
      ).join('');

    } catch (e) {
      console.error(e);
      selectEl.innerHTML = '<option value="">Ошибка загрузки команд</option>';
      msgEl.style.color = '#ff5c5c';
      msgEl.innerText = 'Не удалось загрузить ваши команды';
    }
  }

  function closeInviteModal() {
    document.getElementById('inviteModal').style.display = 'none';
    targetPlayerId = null;
  }

  async function sendInvitation() {
    const teamId = document.getElementById('teamSelect').value;
    const msgEl = document.getElementById('inviteMsg');

    if (!teamId) {
      msgEl.style.color = '#ff5c5c';
      msgEl.innerText = 'Выберите команду!';
      return;
    }

    const token = localStorage.getItem('token') || localStorage.getItem('authToken');

    try {
      const response = await fetch('/api/teams/invite', {
        method: 'POST',
        headers: { 
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json' 
        },
        body: JSON.stringify({ teamId: parseInt(teamId), targetUserId: targetPlayerId })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.message || 'Ошибка отправки приглашения');
      }

      msgEl.style.color = 'var(--lime)';
      msgEl.innerText = 'Запрос успешно отправлен!';
      setTimeout(() => {
        closeInviteModal();
      }, 1200);

    } catch (e) {
      msgEl.style.color = '#ff5c5c';
      msgEl.innerText = e.message || 'Не удалось отправить приглашение';
    }
  }

  // Закрытие модального окна при скролле вверх или вниз
  window.addEventListener('scroll', function() {
    const st = window.pageYOffset || document.documentElement.scrollTop;
    if (Math.abs(st - lastScrollTop) > 5) {
      const modal = document.getElementById('inviteModal');
      if (modal.style.display === 'flex') {
        closeInviteModal();
      }
      lastScrollTop = st <= 0 ? 0 : st;
    }
  }, false);

  // Собираем HTML аватарки: если у игрока есть фото (поле Photo из БД) — показываем img,
  // если фото нет или оно не загрузилось — аккуратно откатываемся на букву-инициал
  function renderAvatar(player, initial) {
    const photoUrl = player.Photo || player.photo || player.photoUrl || player.avatarUrl || '';
    if (!photoUrl) {
      return initial;
    }
    // onerror: если файл не найден/битая ссылка, прячем img и показываем инициал вместо него
    return `<img src="${photoUrl}" alt="${player.username || 'Аватар'}" loading="lazy"
              onerror="this.style.display='none'; this.insertAdjacentText('afterend', '${initial}');">`;
  }

  function isUserLoggedIn() {
    const token = localStorage.getItem('token') || localStorage.getItem('authToken');
    return !!token;
  }

  async function loadPlayers(filter) {
    const container = document.getElementById('results-players');
    container.innerHTML = '<div style="color:var(--text-faint); text-align:center; padding:20px;">Загрузка игроков...</div>';

    try {
      const response = await fetch(`/api/v1/users/search-players?filter=${filter}`);
      if (!response.ok) throw new Error('Ошибка загрузки');

      const players = await response.json();
      container.innerHTML = '';

      if (players.length === 0) {
        container.innerHTML = '<div style="color:var(--text-faint); text-align:center; padding:20px;">Игроки не найдены</div>';
        return;
      }

      players.forEach(p => {
        const initial = p.username ? p.username.charAt(0).toUpperCase() : '?';
        const lookingBadge = p.isLookingForTeam ? ' · <span style="color:var(--lime);">ищет команду</span>' : '';
        const avatarInner = renderAvatar(p, initial);

        const inviteButton = isUserLoggedIn()
          ? `<button class="btn-outline-sm" onclick="openInviteModal(${p.userId}, '${p.username}')">Пригласить</button>`
          : '';

        container.insertAdjacentHTML('beforeend', `
          <div class="p-row">
            <div class="p-avatar">${avatarInner}</div>
            <div class="p-body">
              <div class="p-name">${p.username}</div>
              <div class="p-meta">${p.gamesPlayed || 0} очков${lookingBadge}</div>
            </div>
            <div class="p-level">уровень ${p.level || 1}</div>
            ${inviteButton}
          </div>
        `);
      });
    } catch (e) {
      console.error(e);
      container.innerHTML = '<div style="color:var(--text-faint); text-align:center; padding:20px;">Не удалось загрузить список игроков</div>';
    }
  }
</script>

</body>
</html>
