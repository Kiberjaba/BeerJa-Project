<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Блог</title>
<style>
  :root{
    --bg:#0b0c0d; --card:#17181a; --card-2:#1e2021; --border:#2a2c2e;
    --lime:#c6ff3d; --text:#f2f2f0; --text-dim:#9a9d9c; --text-faint:#6c6f6e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

  header{ border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; background:rgba(11,12,13,0.9); backdrop-filter:blur(8px); }
  .nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; gap:16px; flex-wrap:wrap; }
  .nav-left{ font-weight:900; font-size:14px; letter-spacing:.06em; display:flex; align-items:center; gap:8px; }
  .nav-left .dot{ width:8px; height:8px; border-radius:50%; background:var(--lime); box-shadow:0 0 8px var(--lime); }
  .nav-right{ display:flex; gap:24px; flex-wrap:wrap; font-size:13px; font-weight:600; color:var(--text-dim); }
  .nav-right a:hover{ color:var(--lime); }
  .nav-right a.active{ color:var(--lime); }
  .nav-toggle{ display:none; }

  section{ padding:56px 0; }
  .eyebrow{ font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--lime); margin-bottom:10px; }
  h1{ font-size:clamp(30px,5vw,44px); font-weight:900; line-height:1.1; margin-bottom:14px; max-width:640px; }
  .lead{ font-size:15px; color:var(--text-dim); max-width:560px; line-height:1.5; }

  /* Карточки-аккордеоны */
  .featured, .card {
    cursor: pointer;
    transition: border-color .2s, transform .2s;
  }
  .featured:hover, .card:hover {
    border-color: var(--lime);
  }
  .featured:hover { transform: translateY(-2px); }

  /* Скрытие надписи «Читать статью →» при раскрытии главной */
  .featured.expanded .read-link {
    display: none;
  }

  .article-full-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    opacity: 0;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.7;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .featured.expanded .article-full-content,
  .card.expanded .article-full-content {
    max-height: 1000px;
    opacity: 1;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .featured{ display:grid; grid-template-columns:1.1fr 1fr; gap:0; background:var(--card); border:1px solid var(--border); border-radius:26px; overflow:hidden; margin-top:36px; }
  .featured .thumb{ background:linear-gradient(135deg,var(--card-2),#232520); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12px; font-weight:700; min-height:280px; }
  .featured .body{ padding:34px; display:flex; flex-direction:column; gap:14px; justify-content:center; }
  .tag{ align-self:flex-start; background:rgba(198,255,61,0.12); color:var(--lime); font-size:11px; font-weight:800; padding:6px 12px; border-radius:999px; }
  .featured h2{ font-size:24px; font-weight:800; line-height:1.25; }
  .featured p{ font-size:13px; color:var(--text-dim); line-height:1.6; }
  .meta-row{ display:flex; gap:16px; font-size:12px; color:var(--text-faint); font-weight:600; }
  .read-link{ font-size:13px; font-weight:800; color:var(--lime); display:flex; align-items:center; gap:6px; margin-top:4px; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:36px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; transition: border-color .15s, transform .15s; }
  .card:hover{ border-color:var(--lime); transform:translateY(-2px); }
  .card .thumb{ height:150px; background:linear-gradient(135deg,var(--card-2),#232520); display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:12px; font-weight:700; }
  .card .body{ padding:18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card .tag{ font-size:10px; }
  .card h3{ font-size:15px; font-weight:800; line-height:1.35; }
  .card p{ font-size:12px; color:var(--text-dim); line-height:1.5; }
  .card .meta-row{ font-size:11px; margin-top:4px; }

  .more-row{ text-align:center; margin-top:40px; }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text); padding:13px 30px; border-radius:999px; font-weight:800; font-size:13px; cursor:pointer; }
  .btn-outline:hover{ border-color:var(--lime); color:var(--lime); }

  footer{ border-top:1px solid var(--border); padding:40px 0; }
  .footer-row{ display:flex; align-items:center; justify-content:center; gap:40px; flex-wrap:wrap; }
  .footer-links{ display:flex; gap:32px; font-size:13px; font-weight:700; color:var(--text-dim); }
  .footer-links a:hover{ color:var(--lime); }
  .footer-logo{ width:56px; height:56px; display:flex; align-items:center; justify-content:center; border-radius:50%; overflow:hidden; transition: transform 0.2s ease; }
  .footer-logo img { width: 100%; height: 100%; object-fit: cover; }
  .footer-logo:hover{ transform: scale(1.05); }

  @media (max-width:860px){
    .featured{ grid-template-columns:1fr; }
    .grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:560px){
    .nav-right{ display:none; width:100%; flex-direction:column; gap:14px; padding-top:14px; }
    .nav-right.open{ display:flex; }
    .nav-toggle{ display:block; background:none; border:1px solid var(--border); color:var(--text); width:34px; height:34px; border-radius:8px; font-size:16px; cursor:pointer; }
    .grid{ grid-template-columns:1fr; }
    .wrap{ padding:0 18px; }
    section{ padding:40px 0; }
    .footer-row{ flex-direction:column; gap:20px; }
    .featured .body{ padding:24px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="glav.html" class="nav-left"><span class="dot"></span>БИРЖА</a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-right').classList.toggle('open')">☰</button>
    <nav class="nav-right">
      <a href="#games">Игры</a>
      <a href="Blog.html" class="active">Блог</a>
      <a href="Search.html">Поиск игр/игроков</a>
      <a href="Help.html">Помощь</a>
      <a href="about.html">О нас</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="eyebrow">Блог</div>
    <h1>Истории, лайфхаки и закулисье наших игр</h1>
    <p class="lead">Как готовятся сценарии, что происходит на кухне у ведущих и подборки для тех, кто хочет удивить свою команду.</p>

    <!-- Главная статья -->
    <div id="featured-container"></div>

    <!-- Сетка остальных статей -->
    <div class="grid" id="grid-container"></div>

    <!-- Кнопка подгрузки -->
    <div class="more-row" id="more-container">
      <button class="btn-outline" id="load-more-btn">Показать ещё статьи</button>
    </div>
  </div>
</section>

<footer>
  <div class="wrap footer-row">
    <a href="/" class="footer-logo">
      <img src="Code_Generated_Image.png" alt="БИРЖА Логотип">
    </a>
    <div class="footer-links">
      <a href="https://t.me/LUSTRECASTLE" target="_blank">Чатик</a>
      <a href="https://t.me/LUSTRECASTLE" target="_blank">Блог</a>
    </div>
  </div>
</footer>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const response = await fetch('/api/articles');
      if (!response.ok) throw new Error('Ошибка загрузки статей');
      
      const articles = await response.json();
      if (articles.length === 0) return;
      
      const featuredContainer = document.getElementById('featured-container');
      const gridContainer = document.getElementById('grid-container');
      const loadMoreBtn = document.getElementById('load-more-btn');
      const moreContainer = document.getElementById('more-container');

      let currentArticles = [...articles];
      let visibleCount = 9; // Сколько карточек показываем в сетке изначально (плюс 1 главная = 10 всего)

      function renderBlog() {
        featuredContainer.innerHTML = '';
        gridContainer.innerHTML = '';

        let featuredArticle = currentArticles[0];
        // Берем из массива то количество, которое разрешено переменной visibleCount
        let otherArticles = currentArticles.slice(1, visibleCount + 1);

        // 1. Рендерим главную статью
        if (featuredArticle) {
          const featuredEl = document.createElement('div');
          featuredEl.className = 'featured';
          featuredEl.innerHTML = `
            <div class="thumb">ГЛАВНОЕ ФОТО</div>
            <div class="body">
              <div class="tag">${featuredArticle.tag}</div>
              <h2>${featuredArticle.title}</h2>
              <p>${featuredArticle.excerpt}</p>
              <div class="article-full-content">
                ${featuredArticle.content || '<p>Полный текст статьи пока не добавлен.</p>'}
              </div>
              <div class="meta-row"><span>${featuredArticle.publishedAt}</span><span>${featuredArticle.readTime}</span></div>
              <div class="read-link">Читать статью →</div>
            </div>
          `;

          featuredEl.onclick = () => {
            featuredEl.classList.toggle('expanded');
          };

          featuredContainer.appendChild(featuredEl);
        }

        // 2. Рендерим сетку видимых статей
        otherArticles.forEach((article, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="thumb">ФОТО</div>
            <div class="body">
              <div class="tag">${article.tag}</div>
              <h3>${article.title}</h3>
              <p>${article.excerpt}</p>
              <div class="article-full-content">
                ${article.content || '<p>Полный текст статьи пока не добавлен.</p>'}
              </div>
              <div class="meta-row"><span>${article.publishedAt}</span><span>${article.readTime}</span></div>
            </div>
          `;

          card.onclick = (e) => {
            e.stopPropagation();
            const realIndex = index + 1;
            
            // Меняем местами выбранную карточку и главную статью
            const temp = currentArticles[0];
            currentArticles[0] = currentArticles[realIndex];
            currentArticles[realIndex] = temp;

            renderBlog();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          gridContainer.appendChild(card);
        });

        // 3. Управляем видимостью кнопки «Показать ещё»
        // Если в памяти еще остались скрытые статьи, показываем кнопку, иначе скрываем
        if (visibleCount >= currentArticles.length - 1) {
          moreContainer.style.display = 'none';
        } else {
          moreContainer.style.display = 'block';
        }
      }

      // Собстветвенно клик на кнопку «Показать ещё»
      loadMoreBtn.onclick = () => {
        visibleCount += 9; // Добавляем еще по 9 штук за раз
        renderBlog();
      };

      // Первичный запуск
      renderBlog();

    } catch (error) {
      console.error('Не удалось загрузить статьи из базы:', error);
    }
  });
</script>

</body>
</html>
