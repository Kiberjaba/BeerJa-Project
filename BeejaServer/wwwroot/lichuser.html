<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет игрока</title>
<style>
  :root{
    --bg: #0b0c0d;
    --card: #17181a;
    --card-2: #1e2021;
    --border: #2a2c2e;
    --lime: #c6ff3d;
    --text: #f2f2f0;
    --text-dim: #9a9d9c;
    --text-faint: #6c6f6e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(60% 40% at 15% 0%, rgba(198,255,61,0.06) 0%, transparent 60%),
      radial-gradient(60% 40% at 100% 100%, rgba(198,255,61,0.04) 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  .phone{
    width: 100%;
    height: 100dvh;
    display:flex;
    flex-direction:column;
    background: var(--bg);
    overflow:hidden;
  }
  @media (min-width: 560px){
    body{ padding: 28px 16px; }
    .phone{
      max-width: 440px;
      height: min(880px, 94vh);
      border-radius: 32px;
      border: 1px solid var(--border);
      box-shadow: 0 50px 90px rgba(0,0,0,0.55);
      margin: 0 auto;
    }
  }

  /* ===== HEADER ===== */
  .top{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 18px 8px;
  }
  .role-chip{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
  }
  .role-chip .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--lime);
    box-shadow: 0 0 8px var(--lime);
  }
  .icon-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border); background: var(--card);
    color: var(--text); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  /* ===== SCROLL AREA ===== */
  .content{
    flex:1 1 auto;
    overflow-y:auto;
    padding: 10px 18px 20px;
    -webkit-overflow-scrolling: touch;
  }
  .content::-webkit-scrollbar{ width:0; }

  .profile-head{
    display:flex;
    align-items:center;
    gap: 16px;
    margin-bottom: 22px;
  }
  .avatar-big{
    width: 76px; height:76px; border-radius: 50%;
    background: linear-gradient(135deg, #3a3f2a, #1c1e16);
    border: 3px solid var(--lime);
    display:flex; align-items:center; justify-content:center;
    font-size: 26px; font-weight:800; color:var(--lime);
    position: relative;
    flex-shrink:0;
    cursor:pointer;
  }
  .avatar-edit{
    position:absolute; bottom:-2px; right:-2px;
    width:24px; height:24px; border-radius:50%;
    background: var(--lime); color:#10130a;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight:900;
    border: 2px solid var(--bg);
  }
  .profile-name{ display:flex; flex-direction:column; gap:6px; }
  .nick{ font-size: 20px; font-weight: 800; }
  .change-avatar{
    font-size: 12px; color: var(--lime); font-weight:700;
    background:none; border:none; cursor:pointer; padding:0;
    text-align:left;
  }

  .level-card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 18px;
    margin-bottom: 16px;
  }
  .level-top{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 12px;
  }
  .level-num{ font-size: 22px; font-weight:900; }
  .level-num span{ color: var(--lime); }
  .level-pts{ font-size: 12px; color: var(--text-dim); font-weight:700; }
  .bar-track{
    height: 8px; border-radius: 999px;
    background: #2a2c2e;
    overflow:hidden;
  }
  .bar-fill{
    height:100%; width: 0%;
    background: var(--lime);
    border-radius: 999px;
    transition: width 0.6s ease-out;
  }
  .bar-caption{
    margin-top:8px; font-size:11px; color: var(--text-faint);
  }

  .stats-row{
    display:flex; gap: 12px; margin-bottom: 20px;
  }
  .stat-box{
    flex:1;
    background: var(--card-2);
    border:1px solid var(--border);
    border-radius: 18px;
    padding: 16px 14px;
  }
  .stat-num{ font-size: 22px; font-weight:900; color: var(--lime); }
  .stat-label{ font-size: 11px; color: var(--text-dim); margin-top:4px; font-weight:600; }

  .section-title{
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .history{ display:flex; flex-direction:column; gap:10px; }
  .history-item{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--card);
    border:1px solid var(--border);
    border-radius: 16px;
    padding: 12px 14px;
  }
  .hist-left{ display:flex; flex-direction:column; gap:3px; }
  .hist-name{ font-size:13px; font-weight:700; }
  .hist-date{ font-size:11px; color: var(--text-faint); }
  .hist-score{ font-size: 13px; font-weight:800; color: var(--lime); }
</style>
</head>
<body>

<div class="phone">
  <div class="top">
    <div class="role-chip"><span class="dot"></span>Игрок</div>
    <button class="icon-btn" onclick="window.location.href='user/settings.html'">⚙</button>
  </div>

  <div class="content">
    <div class="profile-head">
      <div class="avatar-big" id="avatarLetter" onclick="alert('Заглушка: выбор аватара')">
        -
        <div class="avatar-edit">✎</div>
      </div>
      <div class="profile-name">
        <div class="nick" id="userNickname">Загрузка...</div>
        <button class="change-avatar" onclick="alert('Заглушка: выбор аватара')">Сменить аватар</button>
      </div>
    </div>

    <div class="level-card">
      <div class="level-top">
        <div class="level-num">Уровень <span id="userLevel">-</span></div>
        <div class="level-pts" id="levelProgressText">0 / 0 очков</div>
      </div>
      <div class="bar-track"><div class="bar-fill" id="progressBar"></div></div>
      <div class="bar-caption" id="remainingText">Загрузка данных...</div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="sessionsCount">0</div>
        <div class="stat-label">Сессий пройдено</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="totalPoints">0</div>
        <div class="stat-label">Баллов всего</div>
      </div>
    </div>

    <div class="section-title">История сессий</div>
    <div class="history">
      <div class="history-item">
        <div class="hist-left">
          <div class="hist-name">Комната QR-2048</div>
          <div class="hist-date">7 августа, 21:14</div>
        </div>
        <div class="hist-score">+280</div>
      </div>
      <div class="history-item">
        <div class="hist-left">
          <div class="hist-name">Комната Neon-Loop</div>
          <div class="hist-date">3 августа, 19:02</div>
        </div>
        <div class="hist-score">+150</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Укажите URL вашего сервера backend
  const API_BASE_URL = 'http://localhost:5234/api/v1/User';

  async function loadUserProfile() {
    // Получаем токен из LocalStorage (сохраненный при входе/регистрации).
    // Страница входа сохраняет его под ключами 'token' и 'authToken' — читаем их же.
    const token = localStorage.getItem('token') || localStorage.getItem('authToken');

    if (!token) {
      console.warn('Токен авторизации не найден. Перенаправление на вход...');
      // window.location.href = '/login.html'; // Разкомментируйте для авто-перенаправления
      return;
    }

    try {
      const response = await fetch(`${API_BASE_URL}/profile-data`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });

      if (!response.ok) {
        if (response.status === 401) {
          alert('Сессия истекла. Пожалуйста, войдите снова.');
        }
        throw new Error(`Ошибка сервера: ${response.status}`);
      }

      const data = await response.json();

      // Отрисовка полученных данных
      document.getElementById('userNickname').innerText = data.username;
      document.getElementById('sessionsCount').innerText = data.sessionsCount;
      document.getElementById('totalPoints').innerText = data.totalPoints;

      // Инициал для аватарки
      if (data.username && data.username.length > 0) {
        const firstLetter = data.username.charAt(0).toUpperCase();
        document.getElementById('avatarLetter').childNodes[0].nodeValue = firstLetter + ' ';
      }

      document.getElementById('userLevel').innerText = data.level;
      document.getElementById('levelProgressText').innerText = `${data.pointsInCurrentLevel} / ${data.pointsRequiredForNext} очков`;
      
      // Заполнение шкалы прогресса (ограничиваем от 0 до 100%)
      const progress = Math.min(Math.max(data.progressPercentage, 0), 100);
      document.getElementById('progressBar').style.width = `${progress}%`;

      document.getElementById('remainingText').innerText = `До уровня ${data.level + 1} осталось ${data.pointsRemaining} очков`;
      document.getElementById('sessionsCount').innerText = data.sessionsCount;
      document.getElementById('totalPoints').innerText = data.totalPoints.toLocaleString('ru-RU');
      
      // Отрисовка истории чекинов
      const historyContainer = document.querySelector('.history');
      historyContainer.innerHTML = ''; // Очищаем статические карточки

      if (!data.recentCheckins || data.recentCheckins.length === 0) {
        historyContainer.innerHTML = '<div style="color: var(--text-faint); font-size: 13px;">У вас пока нет пройденных сессий</div>';
      } else {
        data.recentCheckins.forEach(item => {
          const dateObj = new Date(item.checkedInAt);
          const formattedDate = dateObj.toLocaleString('ru-RU', {
            day: 'numeric',
            month: 'long',
            hour: '2-digit',
            minute: '2-digit'
          });

          const itemHtml = `
            <div class="history-item">
              <div class="hist-left">
                <div class="hist-name">${item.eventTitle}</div>
                <div class="hist-date">${formattedDate}</div>
              </div>
              <div class="hist-score">+${item.pointsAwarded}</div>
            </div>
          `;
          historyContainer.insertAdjacentHTML('beforeend', itemHtml);
        });
}
    } catch (error) {
      console.error('Не удалось загрузить профиль:', error);
      document.getElementById('remainingText').innerText = 'Ошибка загрузки данных';
    }
    
  }

  // Запуск загрузки при загрузке страницы
  document.addEventListener('DOMContentLoaded', loadUserProfile);
</script>

</body>
</html>
