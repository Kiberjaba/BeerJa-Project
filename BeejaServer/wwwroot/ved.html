<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мокап: профиль ведущего</title>
<style>
  :root{
    --bg: #0b0c0d;
    --card: #17181a;
    --card-2: #1e2021;
    --border: #2a2c2e;
    --lime: #c6ff3d;
    --text: #f2f2f0;
    --text-dim: #9a9d9c;
    --text-faint: #6c6f6e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{
    max-width: 780px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ===== HEADER ===== */
  header{
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index:50;
    background: rgba(11,12,13,0.9);
    backdrop-filter: blur(8px);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 0;
    gap: 12px;
  }
  .nav-left{
    font-weight: 900;
    font-size: 13px;
    letter-spacing: .06em;
    display:flex; align-items:center; gap:8px;
  }
  .nav-left .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--lime);
    box-shadow: 0 0 8px var(--lime);
  }

  .auth-actions{ display:flex; align-items:center; gap:8px; }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor:pointer;
    white-space: nowrap;
  }
  .btn-lime-sm{
    background: var(--lime);
    color: #10130a;
    border: none;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    cursor:pointer;
    white-space: nowrap;
  }
  .profile-chip{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
    cursor:pointer;
    font-size: 13px;
    font-weight: 700;
  }
  .profile-chip .avatar{
    width: 28px; height:28px; border-radius:50%;
    background: linear-gradient(135deg, #3a3f2a, #1c1e16);
    border: 2px solid var(--lime);
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight:800; color: var(--lime);
  }

  /* ===== MAIN ===== */
  main{ padding: 40px 0 60px; }

  .role-eyebrow{
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 24px;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 26px;
    margin-bottom: 18px;
  }

  .card-order{
    display:flex;
    flex-direction: column;
    gap: 18px;
  }
  .card-title{
    font-size: 26px;
    font-weight: 800;
  }
  .btn-lime{
    align-self: flex-start;
    background: var(--lime);
    color: #10130a;
    border: none;
    padding: 14px 30px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    cursor:pointer;
    transition: transform .15s ease;
  }
  .btn-lime:hover{ transform: translateY(-2px); }

  .card-examples{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    flex-wrap: wrap;
    background: var(--card-2);
    margin-left: auto;
    width: 88%;
  }
  .card-examples .card-title{ font-size: 22px; }
  .btn-outline{
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--lime);
    color: var(--lime);
    padding: 12px 22px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 13px;
    cursor:pointer;
    transition: background .15s, color .15s;
  }
  .btn-outline:hover{ background: var(--lime); color:#10130a; }

  .card-launch{
    text-align:center;
    padding: 44px 26px;
    cursor:pointer;
    transition: border-color .15s, background .15s;
    border-width: 1px;
  }
  .card-launch:hover{
    border-color: var(--lime);
    background: var(--card-2);
  }
  .card-launch .card-title{ font-size: 28px; }
  .card-launch .card-sub{
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 600;
  }

  /* ===== FOOTER ===== */
  footer{
    border-top: 1px solid var(--border);
    padding: 32px 0;
  }
  .footer-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 36px;
    flex-wrap: wrap;
  }
  .footer-links{
    display:flex; gap: 30px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
  }
  .footer-links a:hover{ color: var(--lime); }
  .footer-logo{
    width: 88px; height: 50px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    display:flex; align-items:center; justify-content:center;
    font-size: 10px;
    font-weight: 800;
    color: var(--text-faint);
    letter-spacing: .04em;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px){
    .wrap{ padding: 0 16px; }
    .card{ padding: 20px; }
    .card-examples{ width: 100%; flex-direction: column; align-items: flex-start; }
    .card-title{ font-size: 22px; }
    .card-launch .card-title{ font-size: 22px; }
    .btn-ghost{ padding: 8px 12px; font-size: 11px; }
    .btn-lime-sm{ padding: 8px 12px; font-size: 11px; }
    .footer-row{ flex-direction: column; gap: 18px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="nav-left"><span class="dot"></span>БИРЖА</div>

    <!-- Гость -->
    <div class="auth-actions" id="auth-guest">
      <button class="btn-ghost" onclick="setLoggedIn(true)">Войти</button>
      <button class="btn-lime-sm" onclick="setLoggedIn(true)">Регистрация</button>
    </div>

    <!-- Авторизован -->
    <div class="auth-actions" id="auth-user" style="display:none;">
      <div class="profile-chip" onclick="alert('Заглушка: переход в профиль пользователя')">
        <div class="avatar">В</div>
        Профиль
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="role-eyebrow">Кабинет ведущего</div>

  <div class="card card-order">
    <div class="card-title">Заказать игру</div>
    <button class="btn-lime" onclick="alert('Заглушка: заказ игры')">Жмать</button>
  </div>

  <div class="card card-examples">
    <div class="card-title">Посмотреть<br>примеры</div>
    <button class="btn-outline" onclick="alert('Заглушка: примеры игр')">Жмать</button>
  </div>

  <div class="card card-launch" onclick="alert('Заглушка: запуск игры')">
    <div class="card-title">Запустить игру</div>
    <div class="card-sub">Начать сессию с уже готовым сценарием</div>
  </div>
</main>

<footer>
  <div class="wrap footer-row">
    <div class="footer-logo">НАШЕ<br>ЛОГО</div>
    <div class="footer-links">
      <a href="#chat">Чатик</a>
      <a href="#blog">Блог</a>
    </div>
  </div>
</footer>

<script>
  function setLoggedIn(isLoggedIn){
    document.getElementById('auth-guest').style.display = isLoggedIn ? 'none' : 'flex';
    document.getElementById('auth-user').style.display = isLoggedIn ? 'flex' : 'none';
  }
</script>

</body>
</html>
