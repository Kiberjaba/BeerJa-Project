<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мокап: лендинг игрок/ведущий</title>
<style>
  :root{
    --bg: #0b0c0d;
    --card: #17181a;
    --card-2: #1e2021;
    --border: #2a2c2e;
    --lime: #c6ff3d;
    --text: #f2f2f0;
    --text-dim: #9a9d9c;
    --text-faint: #6c6f6e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ scroll-behavior:smooth; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ===== HEADER ===== */
  header{
    border-bottom: 1px solid var(--border);
    position: sticky; top:0; z-index:50;
    background: rgba(11,12,13,0.8);
    backdrop-filter: blur(8px);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 16px 0;
    gap: 16px;
    flex-wrap: wrap;
  }
  .nav-left{
    font-weight: 900;
    font-size: 14px;
    letter-spacing: .06em;
    display:flex; align-items:center; gap:8px;
    transition: opacity 0.2s;
  }
  .nav-left:hover{ opacity: 0.8; }
  .nav-left .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--lime);
    box-shadow: 0 0 8px var(--lime);
  }
  .nav-right{
    display:flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .nav-right a{ transition: color .15s; }
  .nav-right a:hover{ color: var(--lime); }
  .nav-toggle{ display:none; }

  /* ===== HERO ===== */
  .hero{
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .hero-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 520px;
  }
  .hero-panel{
    position: relative;
    padding: 56px 40px;
    display:flex;
    flex-direction: column;
    justify-content: space-between;
    background: transparent;
  }
  .panel-player {
    align-items: flex-start;
    text-align: left;
  }

  .panel-host {
    align-items: flex-end;
    text-align: right;
  }
  .panel-eyebrow{
    font-size: 13px;
    font-weight: 800;
    color: var(--lime);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .panel-title{
    font-size: clamp(38px, 6vw, 64px);
    font-weight: 900;
    line-height: 0.95;
    margin-top: 6px;
  }
  .panel-title .accent{ color: var(--lime); }
  .btn-lime{
    align-self: flex-start;
    margin-top: 28px;
    background: var(--lime);
    color: #10130a;
    border: none;
    padding: 15px 26px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .03em;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .panel-host .btn-lime{ align-self: flex-end; }
  .btn-lime:hover{ transform: translateY(-2px); }

  /* ===== SECTIONS ===== */
  section{ padding: 64px 0; }
  .section-title{
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text-dim);
    text-align:center;
    margin-bottom: 28px;
  }

  /* ===== UPCOMING GAMES ===== */
  .games-card{
    background: rgba(23, 24, 26, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 28px;
    overflow: hidden;
    max-width: 760px;
    margin: 0 auto;
  }
  .game-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  .game-row:last-child{ border-bottom:none; }
  .game-row:hover{ background: var(--card-2); }
  .game-name{ font-weight: 700; font-size: 15px; }
  .game-date{
    font-size: 12px;
    font-weight: 800;
    color: var(--lime);
    background: rgba(198,255,61,0.1);
    padding: 6px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* ===== PHOTOS ===== */
  .photo-strip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  
  .arrow-btn {
    flex: 0 0 auto;
    width: 48px; 
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; 
    align-items: center; 
    justify-content: center;
    transition: border-color .15s, color .15s;
  }
  
  .arrow-btn:hover { 
    border-color: var(--lime); 
    color: var(--lime); 
  }

  .photo-viewport {
    flex: 1;
    overflow: hidden;
    max-width: 640px;
    border-radius: 22px;
  }

  .photo-track {
    display: flex;
    transition: transform 0.4s ease-in-out;
  }
  .photo-card {
    flex: 0 0 100%;
    aspect-ratio: 16/9;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--card-2), var(--card));
    border: 1px solid var(--border);
    overflow: hidden;
  }
  
  .photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .dots {
    display: flex; 
    justify-content: center; 
    gap: 8px; 
    margin-top: 20px;
  }
  
  .dots span {
    width: 6px; 
    height: 6px; 
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: background 0.3s;
  }
  
  .dots span.active { 
    background: var(--lime); 
  }

  /* ===== FOOTER ===== */
  footer{
    border-top: 1px solid var(--border);
    padding: 40px 0;
    background: rgba(11, 12, 13, 0.85);
  }
  .footer-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 40px;
    flex-wrap: wrap;
  }
  .footer-links{
    display:flex; gap: 32px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
  }
  .footer-links a:hover{ color: var(--lime); }
  
  .footer-logo {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    overflow: hidden;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }

  .footer-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .footer-logo:hover {
    transform: scale(1.05);
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 860px){
    .hero-grid{ grid-template-columns: 1fr; min-height: auto; }
    .panel-player{ padding: 44px 24px; }
    .panel-host{
      align-items: flex-start;
      text-align: left;
      padding: 44px 24px;
    }
    .panel-host .btn-lime{ align-self: flex-start; }
    .wrap{ padding: 0 18px; }
    section{ padding: 48px 0; }
    .footer-row{ flex-direction: column; gap: 20px; }
    .footer-links{ gap: 22px; flex-wrap: wrap; justify-content:center; }
  }

  @media (max-width: 560px){
    .nav-right{
      display:none;
      width:100%;
      flex-direction: column;
      gap: 14px;
      padding-top: 14px;
    }
    .nav-right.open{ display:flex; }
    .nav-toggle{
      display:block;
      background:none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px; height:34px;
      border-radius: 8px;
      font-size: 16px;
      cursor:pointer;
    }
    .panel-title{ font-size: clamp(32px, 10vw, 44px); }
    .game-row{ padding: 16px 20px; flex-wrap: wrap; }
  }

  /* Видео на весь экран на заднем плане */
  .bg-video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -2;
  }

  /* Тёмная дымка */
  .bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none;
    background: 
      radial-gradient(circle at center, rgba(11, 12, 13, 0.35) 0%, rgba(11, 12, 13, 0.85) 100%),
      linear-gradient(to bottom, rgba(11, 12, 13, 0.6) 0%, transparent 40%, rgba(11, 12, 13, 0.8) 100%);
    backdrop-filter: blur(2px);
  }
</style>
</head>
<body>

<video autoplay loop muted playsinline class="bg-video">
  <source src="kling_20260819_VIDEO_A_black_gl_5553_0.mp4" type="video/mp4">
</video>

<div class="bg-overlay"></div>

<header>
  <div class="wrap nav">
    <a href="glav.html" class="nav-left"><span class="dot"></span>БИРЖА</a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-right').classList.toggle('open')">☰</button>
    <nav class="nav-right">
      <a href="#games">Игры</a>
      <a href="Blog.html">Блог</a>
      <a href="Search.html">Поиск игр/игроков</a>
      <a href="Help.html">Помощь</a>
      <a href="about.html">О нас</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-grid">
    <div class="hero-panel panel-player">
      <div>
        <div class="panel-eyebrow">Для игроков</div>
        <div class="panel-title">Я <span class="accent">ИГРОК</span></div>
      </div>
      <button class="btn-lime" onclick="selectRole('player', 'user/yandex.html')">Жать сюда</button>
    </div>
    <div class="hero-panel panel-host">
      <div>
        <div class="panel-eyebrow">Для организаторов</div>
        <div class="panel-title">Я <span class="accent">ВЕДУЩИЙ</span></div>
      </div>
      <button class="btn-lime" onclick="selectRole('host', 'ved/yandex.html')">Жать сюда</button>
    </div>
  </div>
</section>

<section id="games">
  <div class="wrap">
    <div class="section-title">Предстоящие игры</div>
    <div class="games-card">
      <div class="game-row">
        <div class="game-name">Квиз</div>
        <div class="game-date">1 сентября</div>
      </div>
      <div class="game-row">
        <div class="game-name">Лунный день</div>
        <div class="game-date">15 сентября</div>
      </div>
      <div class="game-row">
        <div class="game-name">Винный батл со слепой дегустацией</div>
        <div class="game-date">23 сентября</div>
      </div>
      <div class="game-row">
        <div class="game-name">День диджея</div>
        <div class="game-date">24 сентября</div>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="section-title">Фотографии с проведённых игр</div>
    
    <div class="photo-strip">
      <button type="button" class="arrow-btn" id="prevBtn">←</button>
      
      <div class="photo-viewport">
        <div class="photo-track" id="photoTrack">
          <div class="photo-card"><img src="ФОТО1.png" alt="Фото 1"></div>
          <div class="photo-card"><img src="ФОТО2.png" alt="Фото 2"></div>
          <div class="photo-card"><img src="ФОТО3.png" alt="Фото 3"></div>
          <div class="photo-card"><img src="ФОТО4.png" alt="Фото 4"></div>
        </div>
      </div>
      
      <button type="button" class="arrow-btn" id="nextBtn">→</button>
    </div>

    <div class="dots" id="dotsContainer">
      <span class="active"></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</section>

<footer>
  <div class="wrap footer-row">
    <a href="glav.html" class="footer-logo">
      <img src="Code_Generated_Image.png" alt="БИРЖА Логотип">
    </a>

    <div class="footer-links">
      <a href="https://t.me/LUSTRECASTLE" target="_blank">Чатик</a>
      <a href="https://t.me/LUSTRECASTLE" target="_blank">Блог</a>
    </div>
  </div>
</footer>

<script>
  // Выбор роли и переход в нужный кабинет при клике
  function selectRole(role, targetUrl) {
    localStorage.setItem('userRole', role);
    localStorage.setItem('isAuth', 'true');
    window.location.href = targetUrl;
  }

  // Слайдер
  let currentIndex = 0;
  const totalPhotos = 4;

  const track = document.getElementById('photoTrack');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dots = document.querySelectorAll('#dotsContainer span');

  function updateSlider(index) {
    if (index < 0) {
      currentIndex = totalPhotos - 1;
    } else if (index >= totalPhotos) {
      currentIndex = 0;
    } else {
      currentIndex = index;
    }

    track.style.transform = `translateX(-${currentIndex * 100}%)`;

    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === currentIndex);
    });
  }

  prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
  nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));

  dots.forEach((dot, i) => {
    dot.addEventListener('click', () => updateSlider(i));
  });
</script>
</body>
</html>
